spring.application.name=EcommerceBackend

# MySQL (database apne aap ban jayegi agar nahi hai)
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Error response me "message" bhejo (frontend isse dikhata hai)
server.error.include-message=always

# JWT secret (kam se kam 32 characters). Production me environment variable se do.
app.jwt.secret=MySuperSecretKeyForEcommerceBackend2026JwtAuthentication

# Frontend URLs jinko API call karne ki permission hai (comma separated)
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173

# Default admin account (pehli baar start par apne aap ban jata hai). PASSWORD ZAROOR BADLO.
app.admin.name=Store Admin
app.admin.email=admin@ecommerce.com
app.admin.password=Admin@123
